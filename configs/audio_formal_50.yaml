project:
  name: health_monitor_ai
  seed: 42

paths:
  audio_dir: data/formal_audio_50
  labels_csv: data/labels/formal_audio_50/audio_labels.csv
  sessions_csv: data/labels/formal_audio_50/sessions.csv
  processed_dir: data/processed/formal_audio_50_features
  models_dir: models/audio
  results_dir: results/audio

audio:
  sample_rate: 16000
  window_seconds: 1.0
  hop_seconds: 0.5
  n_mels: 40
  n_fft: 1024
  hop_length: 160
  fmin: 50
  fmax: 7600

labels:
  positive: cough
  negative: non_cough

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  group_column: person_id

training:
  model: small_cnn
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  device: auto
  early_stopping_patience: 5
  optimizer: adam

run:
  name: audio_formal_50

debug:
  small_data: false

dataset_subset:
  per_class: 25
  min_duration_seconds: 1.0
  cough_source_dir: D:/cough_model_train/DATA/cough/cough_READY/cough
  non_cough_source_dir: D:/cough_model_train/DATA/non_cough/FSD50K_Negative_clean
